<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <title>Employee management</title>
</head>

<body>

<div class="container">

    <h3>Employee management</h3>
    <hr>

    <div class="d-flex mb-3">
        <!-- Add Employee button -->
        <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary btn-sm me-2">
            Add Employee
        </a>
        <form action="/employees/saveAll" method="POST" enctype="multipart/form-data" class="ms-auto">
            <input type="file" name="file" accept=".csv" required>
            <button type="submit" class="btn btn-success btn-sm">
                Upload CSV
            </button>
        </form>
    </div>


    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>DOB</th>
            <th>Address</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="tempEmployee : ${employees}">

            <td th:text="${tempEmployee.firstName} + ' ' + ${tempEmployee.lastName}" />
            <td th:text="${tempEmployee.email}" />
            <td th:text="${tempEmployee.dob}" />
            <td th:text="${tempEmployee.address}"/>
            <td th:text="${tempEmployee.department}" />
            <td th:text="${tempEmployee.salary}" />

            <td>
                <div class="row">

                    <div class="col-small=">
                        <!-- Add "update" button/link -->
                        <form action="#" th:action="@{/employees/showFormForUpdate}" method="POST">

                            <input type="hidden" name="employeeId" th:value="${tempEmployee.id}" />
                            <button type="submit" class="btn btn-info btn-sm me-1" style="float:left;">Update</button>

                        </form>

                        <!-- Add "delete" button/link -->
                        <form action="#" th:action="@{/employees/delete}" method="POST">

                            <input type="hidden" name="employeeId" th:value="${tempEmployee.id}" />
                            <button type="submit" class="btn btn-danger btn-sm me-1"
                                    onclick="if (!(confirm('Are you sure you want to delete this employee?'))) return false">
                                Delete
                            </button>

                        </form>
                    </div>

                </div>
            </td>

        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
