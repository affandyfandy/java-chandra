
      <table class="table table-bordered table-striped">
        <thead class="thead-dark">
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.id }}</td>
            <td>{{ user.fullname}}</td>
            <td>{{ user.email}}</td>
            <td><a href="mailto:{{ user.email }}">{{ user.email }}</a></td>
          </tr>
        </tbody>
      </table>
